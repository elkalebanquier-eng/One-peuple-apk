name: Build One App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build offline installable APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --build-cache --parallel

      - name: Name test APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/one-app-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: one-app-test-apk
          path: android/app/build/outputs/apk/release/one-app-test.apk
          if-no-files-found: error
          retention-days: 14
